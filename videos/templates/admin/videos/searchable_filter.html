{% load i18n %}

<details data-filter-title="{{ title }}" open>
    <summary>
        {% blocktranslate with filter_title=title %}
            By {{ filter_title }}
        {% endblocktranslate %}
    </summary>

    <div class="admin-filter-search-wrap">
        <input
            type="search"
            class="vTextField admin-filter-search"
            data-admin-filter-search
            placeholder="Search options..."
            aria-label="Search {{ title }}"
            autocomplete="off"
        >
    </div>

    <ul data-admin-filter-options>
        {% for choice in choices %}
            <li{% if choice.selected %} class="selected"{% endif %}>
                <a href="{{ choice.query_string|iriencode }}">
                    {{ choice.display }}
                </a>
            </li>
        {% endfor %}
    </ul>
</details>
