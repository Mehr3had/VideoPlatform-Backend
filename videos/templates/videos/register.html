{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="{% static 'videos/css/register.css' %}"
    >

</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Create your VideoPlatform account.
            </p>

            {% if error %}

                <p class="error">
                    {{ error }}
                </p>

            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="register-button"
                >
                    Register
                </button>

            </form>

        </section>

    </main>

</body>

</html>
